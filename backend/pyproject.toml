[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evallayer"
version = "1.0.0"
description = "Structured LLM evaluation framework — CLI and FastAPI backend."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "William P. Mayes" }]
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "sqlmodel==0.0.18",
    "httpx==0.27.0",
    "python-dotenv==1.0.1",
    "pydantic==2.7.1",
    "scipy==1.13.0",
    "numpy==1.26.4",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

# Installing the project exposes the CLI as `evallayer`, equivalent to
# `python -m app.cli`. The entry point calls app.cli.main(), whose return
# value becomes the process exit code.
[project.scripts]
evallayer = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
